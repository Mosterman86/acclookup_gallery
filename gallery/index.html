<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Wolfsonian Image Gallery</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fancyapps/ui/dist/fancybox/fancybox.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    :root {
      --bg:       #000;
      --surface:  #0f0f0f;
      --surface2: #161616;
      --card:     #111;
      --card-hover: #181818;
      --border:   #2a2a2a;
      --border2:  #333;
      --text:     #f0f0f0;
      --muted:    #888;
      --accent:   #c8a96e;
      --font:     'Plus Jakarta Sans', sans-serif;
      --mono:     'DM Mono', monospace;
    }

    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: var(--font); }

    /* ── Top nav ───────────────────────────────────────────── */
    .top-nav {
      width: 100%;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 10px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.78rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .top-nav a { color: var(--muted); text-decoration: none; transition: color 0.2s; }
    .top-nav a:hover { color: var(--text); }
    .top-nav .nav-right { color: var(--muted); }

    /* ── Page wrap ─────────────────────────────────────────── */
    .page-wrap { max-width: 1400px; margin: 0 auto; padding: 40px 24px 60px; }

    /* ── Hero ──────────────────────────────────────────────── */
    .hero { margin-bottom: 28px; }
    .hero-eyebrow {
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0 0 12px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .hero-eyebrow::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border2);
      max-width: 80px;
    }
    .badge {
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 3px 8px;
      border: 1px solid var(--accent);
      color: var(--accent);
      border-radius: 3px;
      margin-left: 10px;
    }
    .hero h1 {
      font-size: clamp(1.4rem, 2.5vw, 2rem);
      font-weight: 700;
      line-height: 1.2;
      margin: 0 0 8px;
      color: var(--text);
      letter-spacing: -0.01em;
    }
    .hero-meta {
      font-size: 0.82rem;
      color: var(--muted);
      margin: 0;
      font-family: var(--mono);
    }

    /* ── Toolbar ───────────────────────────────────────────── */
    .toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 32px;
      flex-wrap: wrap;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--muted);
      border: 1px solid var(--border2);
      border-radius: 4px;
      padding: 8px 14px;
      cursor: pointer;
      background: none;
      font-family: var(--font);
      text-decoration: none;
      transition: color 0.15s, border-color 0.15s, background 0.15s;
      white-space: nowrap;
    }
    .btn:hover { color: var(--text); border-color: #555; background: #111; }
    .btn svg { width: 14px; height: 14px; flex-shrink: 0; }
    .btn-share { border-color: var(--accent); color: var(--accent); }
    .btn-share:hover { background: #1a160a; color: #dbb97e; border-color: #dbb97e; }

    /* Share toast */
    #share-toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #222;
      border: 1px solid #444;
      border-radius: 6px;
      padding: 10px 20px;
      font-size: 0.82rem;
      color: var(--text);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s, transform 0.25s;
      z-index: 9999;
      white-space: nowrap;
    }
    #share-toast.visible { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ── Empty state ───────────────────────────────────────── */
    .empty-state {
      text-align: center;
      padding: 80px 20px;
      color: var(--muted);
    }
    .empty-state h2 { font-size: 1.1rem; font-weight: 500; margin: 0 0 10px; color: #555; }
    .empty-state p  { font-size: 0.85rem; margin: 0; }

    /* ── Tile grid ─────────────────────────────────────────── */
    .tile-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px;
    }

    /* ── Individual tile ───────────────────────────────────── */
    .tile {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s, transform 0.2s;
      text-decoration: none;
      display: flex;
      flex-direction: column;
    }
    .tile:hover {
      border-color: #555;
      background: var(--card-hover);
      transform: translateY(-2px);
    }

    /* Image area */
    .tile-img-wrap {
      position: relative;
      width: 100%;
      padding-top: 100%;   /* 1:1 square crop */
      background: #0a0a0a;
      overflow: hidden;
    }
    .tile-img-wrap img.tile-thumb {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: none;
      transition: transform 0.3s ease;
    }
    .tile:hover .tile-img-wrap img.tile-thumb { transform: scale(1.04); }
    .tile-img-wrap .tile-spinner {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .tile-img-wrap .tile-spinner img {
      width: 24px;
      height: 24px;
      opacity: 0.4;
    }
    .tile-img-wrap.error .tile-spinner { display: none; }
    .tile-img-wrap.error::after {
      content: 'No image';
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      color: #444;
      letter-spacing: 0.05em;
    }

    /* Tile caption */
    .tile-caption {
      padding: 12px 14px 14px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1;
    }
    .tile-title {
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text);
      line-height: 1.35;
      /* clamp to 2 lines */
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .tile-date {
      font-size: 0.78rem;
      color: var(--muted);
      font-weight: 400;
    }
    .tile-accession {
      font-family: var(--mono);
      font-size: 0.72rem;
      color: #555;
      margin-top: 2px;
    }

    /* ── Fancybox caption override ─────────────────────────── */
    .fancybox__caption {
      font-family: var(--font) !important;
      font-size: 0.88rem !important;
      line-height: 1.65 !important;
      padding: 14px 20px !important;
    }

    /* ── Footer ────────────────────────────────────────────── */
    .page-footer {
      text-align: center;
      margin-top: 52px;
      font-size: 0.72rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #444;
    }
  </style>
</head>
<body>

  <nav class="top-nav">
    <a href="https://www.wolfsonian.org" target="_blank">The Wolfsonian–FIU</a>
    <span class="nav-right">Image Gallery</span>
  </nav>

  <div class="page-wrap">

    <header class="hero">
      <p class="hero-eyebrow">Wolfsonian Digital Labs — Image Tools <span class="badge">Proof of Concept</span></p>
      <h1>Collection Image Gallery</h1>
      <p class="hero-meta" id="gallery-count"></p>
    </header>

    <div class="toolbar">
      <button class="btn" onclick="goBack()">
        <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M10 12L6 8l4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Back to Lookup
      </button>
      <button class="btn btn-share" onclick="shareGallery()">
        <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="12" cy="3"  r="1.5" stroke="currentColor" stroke-width="1.4"/>
          <circle cx="12" cy="13" r="1.5" stroke="currentColor" stroke-width="1.4"/>
          <circle cx="4"  cy="8"  r="1.5" stroke="currentColor" stroke-width="1.4"/>
          <line x1="10.6" y1="3.7"  x2="5.4" y2="7.3"  stroke="currentColor" stroke-width="1.4"/>
          <line x1="10.6" y1="12.3" x2="5.4" y2="8.7"  stroke="currentColor" stroke-width="1.4"/>
        </svg>
        Share Gallery
      </button>
    </div>

    <div id="gallery-grid"></div>

    <footer class="page-footer">The Wolfsonian–Florida International University</footer>

  </div>

  <div id="share-toast">Link copied to clipboard</div>

  <script src="https://cdn.jsdelivr.net/npm/@fancyapps/ui/dist/fancybox/fancybox.umd.js"></script>
  <script>

    const THUMB_BASE = "https://labs.wolfsonian.org/thumbnail-service/api/thumbnail";

    function getUrl(path, w, h) {
      return `${THUMB_BASE}?path=${encodeURIComponent(path.replace(/\\/g, "/"))}&width=${w}&height=${h}`;
    }

    /* ── Back ──────────────────────────────────────────────── */
    function goBack() {
      if (history.length > 1) history.back();
      else window.location.href = '../index.html';
    }

    /* ── Share ─────────────────────────────────────────────── */
    function shareGallery() {
      const url = window.location.href;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(url).then(showToast).catch(() => copyFallback(url));
      } else {
        copyFallback(url);
      }
    }
    function copyFallback(url) {
      const ta = document.createElement('textarea');
      ta.value = url;
      ta.style.cssText = 'position:fixed;opacity:0;top:0;left:0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      showToast();
    }
    function showToast() {
      const toast = document.getElementById('share-toast');
      toast.classList.add('visible');
      setTimeout(() => toast.classList.remove('visible'), 2500);
    }

    /* ── Load data ─────────────────────────────────────────── */
    // Async wrapper so we can await a server fetch when ?gallery= param is present
    async function loadItemsAsync() {
      // Priority 1: ?gallery=Name → fetch from server (works when deployed to labs)
      const galleryParam = new URLSearchParams(window.location.search).get("gallery");
      if (galleryParam) {
        try {
          const resp = await fetch('/galleries/' + encodeURIComponent(galleryParam) + '.json');
          if (resp.ok) {
            const items = await resp.json();
            console.log("Gallery: loaded", items.length, "items from server:", galleryParam);
            return items;
          } else {
            console.info("Gallery: server fetch returned", resp.status, "— trying fallbacks");
          }
        } catch(e) {
          console.info("Gallery: server not available for gallery param, trying fallbacks:", e.message);
        }
      }
      // Priority 2: URL hash (local dev fallback — full data encoded in URL)
      if (location.hash && location.hash.length > 1) {
        try {
          const items = JSON.parse(decodeURIComponent(escape(atob(location.hash.slice(1)))));
          console.log("Gallery: loaded", items.length, "items from URL hash");
          return items;
        } catch(e) {
          console.warn("Gallery: URL hash parse failed, trying sessionStorage", e);
        }
      }
      // Priority 3: sessionStorage (same-session immediate navigation)
      const metaRaw  = sessionStorage.getItem("galleryMetadata");
      const pathsRaw = sessionStorage.getItem("galleryImagePaths");
      console.log("Gallery sessionStorage —", metaRaw ? "metadata found" : "no metadata", pathsRaw ? "| paths found" : "| no paths");
      if (metaRaw) {
        try { return JSON.parse(metaRaw); } catch(e) {}
      }
      if (pathsRaw) {
        return pathsRaw.split("\n").filter(Boolean).map(p => ({
          path: p, accession: "", title: "", date: "", place: "", desc: ""
        }));
      }
      return [];
    }

    // Synchronous shim kept for any legacy callers
    function loadItems() { return []; }

    /* ── Render ─────────────────────────────────────────────── */
    function renderGallery(items) {
      const grid    = document.getElementById("gallery-grid");
      const countEl = document.getElementById("gallery-count");
      if (!items || !items.length) {
        grid.innerHTML = `<div class="empty-state">
          <h2>No images to display</h2>
          <p>Return to the lookup tool, select items, and click <strong>Create Gallery</strong>.</p>
        </div>`;
        return;
      }

      countEl.textContent = `${items.length} item${items.length !== 1 ? "s" : ""}`;
      grid.className = "tile-grid";

      items.forEach(item => {
        const thumbUrl = getUrl(item.path, 600, 600);
        const fancyUrl = getUrl(item.path, 1600, 1200);

        // Full metadata shown in lightbox caption
        const captionHTML = [
          item.title    ? `<strong style="font-size:1rem">${item.title}</strong>` : "",
          item.accession? `<span style="font-family:\'DM Mono\',monospace;font-size:0.8rem;color:#aaa">${item.accession}</span>` : "",
          item.date     ? `<span>Date: ${item.date}</span>`                       : "",
          item.place    ? `<span>Place: ${item.place}</span>`                     : "",
          item.desc     ? `<span style="color:#bbb;font-size:0.85rem">${item.desc}</span>` : ""
        ].filter(Boolean).join('<br/>');

        const tile = document.createElement('a');
        tile.className = "tile";
        tile.href = fancyUrl;
        tile.setAttribute('data-fancybox', 'gallery');
        tile.setAttribute('data-caption', captionHTML);
        tile.setAttribute('data-thumb', thumbUrl);

        tile.innerHTML = `
          <div class="tile-img-wrap" id="wrap-${item.accession || Math.random().toString(36).slice(2)}">
            <div class="tile-spinner"><img src="../spinner.gif" alt="Loading…" /></div>
            <img class="tile-thumb" data-src="${thumbUrl}" alt="${(item.title || item.accession || '').replace(/"/g, '&quot;')}" />
          </div>
          <div class="tile-caption">
            <div class="tile-title">${item.title || '<span style="color:#555;font-style:italic">Untitled</span>'}</div>
            ${item.date       ? `<div class="tile-date">${item.date}</div>` : ''}
            ${item.accession  ? `<div class="tile-accession">${item.accession}</div>` : ''}
          </div>`;

        grid.appendChild(tile);

        // Lazy-load thumbnail
        const img     = tile.querySelector('img.tile-thumb');
        const wrap    = tile.querySelector('.tile-img-wrap');
        const spinner = tile.querySelector('.tile-spinner');
        img.onload  = () => { img.style.display = 'block'; spinner.style.display = 'none'; };
        img.onerror = () => { spinner.style.display = 'none'; wrap.classList.add('error'); };
        img.src = img.dataset.src;
      });

      Fancybox.bind("[data-fancybox='gallery']", {
        Toolbar: {
          display: {
            left:   ["infobar"],
            middle: [],
            right:  ["slideshow", "fullscreen", "download", "close"]
          }
        },
        caption: { type: "html" }
      });
    }

    document.addEventListener("DOMContentLoaded", async function() {
      const items = await loadItemsAsync();
      renderGallery(items);
    });
  </script>
</body>
</html>
